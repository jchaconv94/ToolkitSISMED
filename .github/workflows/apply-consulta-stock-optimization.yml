name: Aplicar optimizacion Consulta Stock

on:
  push:
    branches:
      - optimize-consulta-stock-cold-start

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: optimize-consulta-stock-cold-start
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Aplicar cambios
        run: python .github/apply_consulta_stock_optimization_v2.py

      - name: Instalar dependencias
        run: npm install

      - name: Verificacion TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Limpiar archivos temporales
        run: |
          rm .github/apply_consulta_stock_optimization.py
          rm .github/apply_consulta_stock_optimization_v2.py
          rm .github/workflows/apply-consulta-stock-optimization.yml

      - name: Commit de cambios validados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(consulta-stock): acelerar primera carga y separar Supabase"
          git push origin HEAD:optimize-consulta-stock-cold-start
