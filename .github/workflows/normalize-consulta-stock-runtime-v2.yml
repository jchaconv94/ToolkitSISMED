name: Normalizar diff Consulta Stock runtime v2

on:
  push:
    branches:
      - fix-consulta-stock-runtime-v2

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-consulta-stock-runtime-v2
          fetch-depth: 0

      - name: Igualar finales de línea con main
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('components/SheetSearchModule.tsx')
          current = path.read_bytes().decode('utf-8').replace('\r\n', '\n')
          main_raw = subprocess.check_output(['git', 'show', 'origin/main:components/SheetSearchModule.tsx'])
          newline = '\r\n' if b'\r\n' in main_raw else '\n'
          path.write_bytes(current.replace('\n', newline).encode('utf-8'))
          print('Finales de línea alineados con main:', repr(newline))

      - name: Limpiar workflow temporal
        run: rm -f .github/workflows/normalize-consulta-stock-runtime-v2.yml

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SheetSearchModule.tsx .github/workflows/normalize-consulta-stock-runtime-v2.yml
          git commit -m "chore(stock): normalizar diff de Consulta Stock"
          git push origin HEAD:fix-consulta-stock-runtime-v2
