name: Publicar reenvío de stock (Supabase)

# Publica la función `stock-relay` en Supabase Edge Functions: el camino de respaldo B del
# envío de stock del Toolkit (el A es /stock de cloudflare/conexion, con el mismo código).
# Secreto del repositorio: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# --no-verify-jwt: el Toolkit no tiene sesión; la función verifica la clave de envío ella misma.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/stock-relay/**"
      - ".github/workflows/supabase-stock-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-stock-relay
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sin el secreto no se publica, pero no se marca en rojo: el Toolkit funciona sin este
      # respaldo (usa Cloudflare). El aviso queda en el resumen de la ejecución.
      - name: Comprobar secreto
        id: secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secreto SUPABASE_ACCESS_TOKEN: no se publicó stock-relay. Ver docs/ENVIO_STOCK_RESPALDO.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secret.outputs.ok == 'true'
        with:
          version: latest

      - name: Publicar función stock-relay
        if: steps.secret.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy stock-relay --project-ref ujknopysvgqqvkmgrfhp --no-verify-jwt --use-api
