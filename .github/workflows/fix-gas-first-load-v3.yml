name: Corregir primera carga GAS v3

on:
  push:
    branches:
      - fix-consulta-stock-first-load-v3

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-consulta-stock-first-load-v3
          fetch-depth: 0

      - name: Aplicar corrección focalizada
        run: python .github/scripts/fix_gas_first_load_v3.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Limpiar temporales
        if: success()
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          rm -f .github/workflows/diagnose-gas-first-load.yml
          rm -f .github/workflows/fix-gas-first-load-v3.yml
          rm -f .github/scripts/fix_gas_first_load_v3.py

      - name: Commit y push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/gasConnectionService.ts .github/workflows/diagnose-gas-first-load.yml .github/workflows/fix-gas-first-load-v3.yml .github/scripts/fix_gas_first_load_v3.py
          git commit -m "fix(stock): robustecer metadata en primera carga"
          git push origin HEAD:fix-consulta-stock-first-load-v3
