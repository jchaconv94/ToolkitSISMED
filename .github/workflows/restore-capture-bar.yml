name: Restaurar barra de captura Consulta Stock

on:
  push:
    branches:
      - optimize-consulta-stock-cold-start

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: optimize-consulta-stock-cold-start
          fetch-depth: 0

      - name: Restaurar barra de captura desde main
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('components/SheetSearchModule.tsx')
          current = path.read_bytes()
          marker = b'      {/* Floating Deficiency Capture Bar when in Capture Mode */}'
          modal = b'      {/* Deficiency Capture Modal (Preview & Image Generation) */}'

          if marker in current:
              print('La barra de captura ya está presente.')
          else:
              main = subprocess.check_output(['git', 'show', 'origin/main:components/SheetSearchModule.tsx'])
              start = main.find(marker)
              end = main.find(modal, start)
              if start < 0 or end < 0:
                  raise RuntimeError('No se encontró el bloque de barra de captura en main')
              block = main[start:end]
              insert_at = current.find(modal)
              if insert_at < 0:
                  raise RuntimeError('No se encontró el modal de captura en la rama')
              path.write_bytes(current[:insert_at] + block + current[insert_at:])
              print('Barra de captura restaurada.')
          PY

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificación TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Restaurar lockfile y quitar workflow temporal
        run: |
          git checkout origin/main -- package-lock.json
          rm .github/workflows/restore-capture-bar.yml

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(consulta-stock): conservar barra de captura de deficiencias"
          git push origin HEAD:optimize-consulta-stock-cold-start
