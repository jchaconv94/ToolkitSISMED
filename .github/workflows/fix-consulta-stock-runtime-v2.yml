name: Corregir Consulta Stock runtime v2

on:
  push:
    branches:
      - fix-consulta-stock-runtime-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-consulta-stock-runtime-v2
          fetch-depth: 0

      - name: Aplicar corrección focalizada
        run: python .github/scripts/fix_consulta_stock_runtime_v2.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificación TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Limpiar temporales
        if: success()
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          rm -f .github/workflows/fix-consulta-stock-runtime-v2.yml
          rm -f .github/scripts/fix_consulta_stock_runtime_v2.py

      - name: Commit y push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/SheetSearchModule.tsx services/gasConnectionService.ts services/supabaseClient.ts services/stockStorageService.ts types.ts .github/workflows/fix-consulta-stock-runtime-v2.yml .github/scripts/fix_consulta_stock_runtime_v2.py
          git commit -m "fix(stock): agilizar carga inicial y estabilizar historial"
          git push origin HEAD:fix-consulta-stock-runtime-v2
