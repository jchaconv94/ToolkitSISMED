name: Corregir historial y refresco Consulta Stock

on:
  push:
    branches:
      - fix-consulta-stock-history-refresh

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-consulta-stock-history-refresh
          fetch-depth: 0

      - name: Aplicar correcciones focalizadas
        shell: python
        run: |
          from pathlib import Path

          def load(path):
              raw = Path(path).read_bytes()
              text = raw.decode("utf-8")
              nl = "\r\n" if "\r\n" in text else "\n"
              return text, nl

          def save(path, text):
              Path(path).write_bytes(text.encode("utf-8"))

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: se esperaba 1 coincidencia y se encontraron {count}")
              return text.replace(old, new, 1)

          # 1) EstablishmentCard: permitir ocultar la fila de historial por módulo.
          path = "components/EstablishmentCard.tsx"
          text, nl = load(path)
          text = replace_once(
              text,
              f"  isStaticPreview?: boolean;{nl}  className?: string;",
              f"  isStaticPreview?: boolean;{nl}  showHistoryRow?: boolean;{nl}  className?: string;",
              "prop showHistoryRow",
          )
          text = replace_once(
              text,
              f"  isStaticPreview = false,{nl}  className = \"\",",
              f"  isStaticPreview = false,{nl}  showHistoryRow = true,{nl}  className = \"\",",
              "default showHistoryRow",
          )
          text = replace_once(
              text,
              f"          {{/* Movements / Supabase Row */}}{nl}          <div",
              f"          {{/* Fila de historial opcional: cada módulo decide si posee una fuente histórica */}}{nl}          {{showHistoryRow && ({nl}          <div",
              "inicio fila historial",
          )
          end_old = (
              f"            )}}{nl}"
              f"          </div>{nl}"
              f"        </div>{nl}"
              f"      </div>{nl}{nl}"
              f"      {{/* Bottom Row: Consultar Stock + items */}}"
          )
          end_new = (
              f"            )}}{nl}"
              f"          </div>{nl}"
              f"          )}}{nl}"
              f"        </div>{nl}"
              f"      </div>{nl}{nl}"
              f"      {{/* Bottom Row: Consultar Stock + items */}}"
          )
          text = replace_once(text, end_old, end_new, "cierre fila historial")
          save(path, text)

          # 2) Consulta Stock: ocultar historial Supabase y evitar auto-refresh redundante.
          path = "components/SheetSearchModule.tsx"
          text, nl = load(path)
          card_old = (
              f"                                  <EstablishmentCard{nl}"
              f"                                    key={{sheet.id}}{nl}"
              f"                                    data={{cardData}}{nl}"
          )
          card_new = (
              f"                                  <EstablishmentCard{nl}"
              f"                                    key={{sheet.id}}{nl}"
              f"                                    data={{cardData}}{nl}"
              f"                                    showHistoryRow={{false}}{nl}"
          )
          text = replace_once(text, card_old, card_new, "ocultar historial en grid")

          auto_old = (
              f"      if (scriptUrls.length > 0) {{{nl}"
              f"        // Siempre hacemos fetch de manera silenciosa para no bloquear la pantalla, como sugirió el usuario.{nl}"
              f"        fetchData(undefined, true);{nl}"
              f"      }} else {{"
          )
          auto_new = (
              f"      if (scriptUrls.length > 0) {{{nl}"
              f"        // Si IndexedDB ya fue verificado hace pocos minutos, no volver a golpear GAS al entrar.{nl}"
              f"        // El usuario conserva el botón Sincronizar para forzar una comprobación cuando lo necesite.{nl}"
              f"        const hasCachedDataset = sources.length > 0 && data.length > 0;{nl}"
              f"        const lastSyncAgeMs = lastGlobalSync{nl}"
              f"          ? Date.now() - lastGlobalSync.getTime(){nl}"
              f"          : Number.POSITIVE_INFINITY;{nl}"
              f"        const CACHE_RECHECK_WINDOW_MS = 5 * 60 * 1000;{nl}"
              f"        if (!hasCachedDataset || lastSyncAgeMs >= CACHE_RECHECK_WINDOW_MS) {{{nl}"
              f"          fetchData(undefined, true);{nl}"
              f"        }}{nl}"
              f"      }} else {{"
          )
          text = replace_once(text, auto_old, auto_new, "ventana de revalidacion")

          button_old = (
              f"              {{isLoading || isSilentSyncing{nl}"
              f"                ? \"Sincronizando...\"{nl}"
              f"                : \"Sincronizar\"}}"
          )
          button_new = (
              f"              {{isLoading{nl}"
              f"                ? \"Sincronizando...\"{nl}"
              f"                : isSilentSyncing{nl}"
              f"                  ? \"Verificando...\"{nl}"
              f"                  : \"Sincronizar\"}}"
          )
          text = replace_once(text, button_old, button_new, "texto del boton sync")
          save(path, text)

          # 3) Vista previa/captura de Consulta Stock: tampoco mostrar historial ajeno.
          path = "components/DeficiencyCaptureModal.tsx"
          text, nl = load(path)
          preview_old = (
              f"                      <EstablishmentCard{nl}"
              f"                        data={{item}}{nl}"
              f"                        isStaticPreview={{true}}{nl}"
          )
          preview_new = (
              f"                      <EstablishmentCard{nl}"
              f"                        data={{item}}{nl}"
              f"                        isStaticPreview={{true}}{nl}"
              f"                        showHistoryRow={{false}}{nl}"
          )
          text = replace_once(text, preview_old, preview_new, "ocultar historial en captura")
          save(path, text)

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificación TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Limpiar workflow temporal y lockfile
        if: success()
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          rm -f .github/workflows/fix-consulta-stock-history-refresh.yml

      - name: Commit y push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/EstablishmentCard.tsx components/SheetSearchModule.tsx components/DeficiencyCaptureModal.tsx .github/workflows/fix-consulta-stock-history-refresh.yml
          git commit -m "fix(stock): ocultar historial ajeno y evitar refrescos redundantes"
          git push origin HEAD:fix-consulta-stock-history-refresh
