name: Limpiar diff Consulta Stock

on:
  push:
    branches:
      - optimize-consulta-stock-cold-start

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: optimize-consulta-stock-cold-start
          fetch-depth: 0

      - name: Restaurar lockfile sin cambios funcionales
        run: git checkout origin/main -- package-lock.json

      - name: Preservar CRLF en archivos existentes
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'AGENTS.md',
              'components/SheetSearchModule.tsx',
              'docs/DESKTOP_INTEGRATION_SISMED_2.0.md',
              'services/gasConnectionService.ts',
          ]
          for name in files:
              p = Path(name)
              text = p.read_bytes().decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
              p.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificacion TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Quitar workflow temporal
        run: rm .github/workflows/cleanup-consulta-stock-diff.yml

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: preservar formato en optimización de Consulta Stock"
          git push origin HEAD:optimize-consulta-stock-cold-start
