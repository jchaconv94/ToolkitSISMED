name: Restaurar historial independiente Consulta Stock

on:
  push:
    branches:
      - fix-consulta-stock-history-refresh

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-consulta-stock-history-refresh
          fetch-depth: 0

      - name: Aplicar reparación focalizada
        run: python .github/scripts/restore_consulta_stock_history.py

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Verificación TypeScript
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Limpiar archivos temporales y lockfile
        if: success()
        run: |
          git checkout -- package-lock.json 2>/dev/null || true
          rm -f .github/workflows/restore-consulta-stock-history.yml
          rm -f .github/scripts/restore_consulta_stock_history.py

      - name: Commit y push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(stock): restaurar historial Supabase sin bloquear Consulta Stock"
          git push origin HEAD:fix-consulta-stock-history-refresh