name: Publicar servicio de conexión (Cloudflare)

# Publica cloudflare/conexion (sismed-conexion) en Cloudflare Workers.
# Secretos del repositorio: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# VITE_SUPABASE_ANON_KEY (la clave pública de Supabase que ya usa la web) y
# CLOUDFLARE_ANALYTICS_TOKEN (solo lectura de métricas, para los topes de consumo).

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/conexion/**"
      - ".github/workflows/cloudflare-conexion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-conexion
  cancel-in-progress: false

jobs:
  deploy:
    name: Probar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/conexion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/conexion/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Comprobar secretos
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_ANALYTICS_TOKEN (clave de Cloudflare de solo lectura de métricas). Ver docs/BACKUPS_SISMED.md, etapa 3."
            exit 1
          fi

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/conexion
          # La misma versión de package-lock.json (requiere Node 22).
          wranglerVersion: "4.145.0"
          secrets: |
            SUPABASE_ANON_KEY
            CF_ACCOUNT_ID
            CF_ANALYTICS_TOKEN
        env:
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
